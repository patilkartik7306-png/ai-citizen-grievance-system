{% extends 'base.html' %}{% block content %}<div class="form-card"><h1>Lodge Grievance</h1><form method="POST" enctype="multipart/form-data"><label>1. Complaint Category</label><select id="category" name="category" required><option value="">-- Select Category --</option>{% for c in options %}<option value="{{c}}">{{c}}</option>{% endfor %}</select><label>2. Complaint Type</label><select id="type" name="complaint_type" required disabled><option>-- First select a category --</option></select><label>3. Complaint Photo</label><input type="file" name="complaint_photo" accept="image/png,image/jpeg,image/webp" required><label>4. Additional Details</label><textarea name="complaint_details" placeholder="Explain the problem, location or any extra information."></textarea><button class="btn">Submit Grievance</button></form></div><script>const o={{options|tojson}}; const c=document.getElementById('category'),t=document.getElementById('type'); c.onchange=()=>{t.innerHTML=''; if(!c.value){t.disabled=true;t.add(new Option('-- First select a category --',''));return} t.disabled=false;t.add(new Option('-- Select Complaint Type --',''));o[c.value].forEach(x=>t.add(new Option(x,x)));};</script>{% endblock %}
